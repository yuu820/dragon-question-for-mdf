<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドラゴンクエッション</title>
    <!-- Socket.IOのクライアントライブラリ -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            color-scheme: light;
            font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
            --ink: #3f2f27;
            --accent: #e66b3d;
            --accent-dark: #bd4826;
            --q-appear-duration: 0.7s; 
        }
        * { box-sizing: border-box; }
        html { font-size: 20px; }
        body { margin: 0; padding: 0; color: var(--ink); background: #8fc8d8; overflow: hidden; }

        /* --- 表示モード切り替え --- */
        #role-selection, #monitor-container, #controller-container { display: none; }
        body.mode-select #role-selection { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        body.mode-monitor #monitor-container { display: block; }
        body.mode-controller #controller-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }

        /* 背景動画 (モニター用) */
        #bg-video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; pointer-events: none; }

        /* 共通パネルデザイン */
        .hud-panel {
            pointer-events: auto; border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 253, 246, 0.9);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25); text-align: center; padding: 30px; border-radius: 20px;
        }

        /* --- モニター用UI --- */
        .fpv-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; animation: fpv-float 8s ease-in-out infinite; }
        @keyframes fpv-float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 33% { transform: translateY(15px) rotate(1deg); } 66% { transform: translateY(-10px) rotate(-0.5deg); } }
        .rope { position: absolute; top: -20%; width: 18px; height: 150%; background: repeating-linear-gradient(-45deg, #a67332, #a67332 8px, #8b5a2b 8px, #8b5a2b 16px); box-shadow: inset 4px 0 6px rgba(0,0,0,0.5), -5px 10px 20px rgba(0,0,0,0.4); z-index: 1; }
        .rope-left { left: 12%; transform-origin: top left; transform: rotate(22deg); }
        .rope-right { right: 12%; transform-origin: top right; transform: rotate(-22deg); }
        .basket-edge { position: absolute; bottom: -15vh; left: -10vw; width: 120vw; height: 45vh; background: repeating-linear-gradient(45deg, #a67332, #a67332 20px, #8b5a2b 20px, #8b5a2b 40px); border-top: 40px solid #5c3a21; border-radius: 50% 50% 0 0 / 50px 50px 0 0; box-shadow: inset 0 25px 50px rgba(0,0,0,0.8), 0 -20px 40px rgba(0,0,0,0.5); z-index: 2; }
        .basket-edge::after { content: ''; position: absolute; top: -40px; left: 0; width: 100%; height: 40px; border-radius: inherit; background: linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, transparent 100%); }
        #egg-visual { position: absolute; bottom: -15vh; left: 0; right: 0; margin: 0 auto; z-index: 3; width: min(600px, 100vw); aspect-ratio: 256 / 240; background-image: url('/assets/egg-stages.png'); background-repeat: no-repeat; background-size: 500% 300%; filter: drop-shadow(0 20px 20px rgba(0, 0, 0, 0.45)); will-change: transform; }
        #egg-visual::after { content: ""; position: absolute; inset: 12%; border: 5px solid rgba(255, 249, 205, .9); border-radius: 50%; opacity: 0; pointer-events: none; }
        #egg-particles { position: absolute; z-index: 4; bottom: calc(25vh + 120px); left: 50%; width: 1px; height: 1px; pointer-events: none; }
        
        #hp-panel { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: min(800px, calc(100% - 40px)); padding: 12px 24px; border-radius: 16px; z-index: 10; }
        #hp-row { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 800; }
        #hp-track { height: 16px; margin-top: 8px; border-radius: 999px; background: rgba(0, 0, 0, 0.15); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); overflow: hidden;}
        #hp-bar { width: 100%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ef5747, #f1a441 55%, #6ebc70); transform-origin: left; transition: width .45s ease; }

        #top-hud { position: fixed; top: 110px; left: 50%; transform: translateX(-50%); width: min(800px, calc(100% - 40px)); z-index: 10; }
        #monitor-waiting { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; width: min(600px, 90vw); }

        /* エフェクト */
        .pop-appear { animation: popAppear var(--q-appear-duration) cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popAppear { 0% { transform: scale(0.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* 激突レイヤー */
        #clash-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        #clash-layer.active { opacity: 1; }
        .clash-item { position: absolute; font-size: 4rem; font-weight: 900; color: white; text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 5px 0 #333; opacity: 0; }
        .clash-player.animate { animation: clashLeft 0.5s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards; color: #6bc2a8; }
        .clash-correct.animate { animation: clashRight 0.5s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards; color: #f1a441; }
        @keyframes clashLeft { 0% { transform: translateX(-60vw) scale(1.5); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateX(-15px) scale(1); opacity: 1; } }
        @keyframes clashRight { 0% { transform: translateX(60vw) scale(1.5); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateX(15px) scale(1); opacity: 1; } }
        #clash-flash { position: absolute; width: 200vw; height: 200vh; background: white; opacity: 0; z-index: 21; }
        #clash-flash.animate { animation: flashAnim 0.4s ease-out; }
        @keyframes flashAnim { 0% { opacity: 0; } 20% { opacity: 0.8; } 100% { opacity: 0; } }
        #diff-result { position: absolute; font-size: 6rem; font-weight: 900; color: #ff3b3b; text-shadow: 0 0 30px rgba(255,255,255,0.8), 0 10px 0 #900000, 0 15px 20px rgba(0,0,0,0.8); opacity: 0; transform: scale(0); }
        #diff-result.animate { animation: diffPop 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes diffPop { 0% { transform: scale(0); opacity: 0; } 20% { transform: scale(1.2); opacity: 1; } 35% { transform: scale(1); opacity: 1; } 80% { transform: scale(1); opacity: 1; filter: blur(0px); } 100% { transform: scale(1.5); opacity: 0; filter: blur(10px); } }

        /* --- コントローラー用UI --- */
        #controller-container .hud-panel { width: min(600px, 95vw); }
        h1, h2, h3 { margin: 0 0 16px; color: #5a3420; text-shadow: 0 2px 4px rgba(255,255,255,0.9); }
        input[type="number"], input[type="text"] { width: min(240px, 100%); padding: 15px 20px; border: 3px solid rgba(139, 90, 43, 0.3); border-radius: 14px; font-size: 1.3rem; font-weight: bold; text-align: center; }
        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 5px rgba(230, 107, 61, 0.25); }
        button { padding: 15px 30px; border: 0; border-radius: 14px; color: white; background: var(--accent); box-shadow: 0 6px 0 var(--accent-dark); font: inherit; font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all .15s ease; margin-top: 15px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--accent-dark); }
        button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark); }
        button:disabled { filter: grayscale(.4); opacity: .8; pointer-events: none; }
        .btn-large { width: 100%; }
        .feedback { min-height: 55px; color: #c93a1c; font-weight: 800; font-size: 1.2rem; margin-top: 15px; }
        .hidden { display: none !important; }

        /* たまごアニメーション */
        #hp-bar.damage { animation: hp-damage .6s ease; }
        #egg-visual.damaged { animation: egg-hit .65s ease; }
        #egg-visual.damaged::after { animation: crack-flash .55s ease-out; }
        #egg-visual.breaking { animation: egg-break .95s cubic-bezier(.2, .85, .35, 1); }
        #egg-visual.breaking::after { animation: break-flash .7s ease-out; }
        .shell-particle { position: absolute; width: var(--size); height: calc(var(--size) * 1.15); background: linear-gradient(145deg, #fff9df 10%, #dec99e 62%, #a78b69); clip-path: polygon(50% 0, 100% 28%, 82% 100%, 18% 82%, 0 30%); opacity: 0; animation: shell-fragment .78s cubic-bezier(.16, .72, .35, 1) var(--delay) forwards; }
        @keyframes egg-hit { 0%, 100% { transform: translateX(0) rotate(0); } 15% { transform: translateX(-15px) rotate(-3.5deg) scale(1.02); } 32% { transform: translateX(13px) rotate(3deg); } 52% { transform: translateX(-9px) rotate(-2deg); } 72% { transform: translateX(5px) rotate(1deg); } }
        @keyframes egg-break { 0% { transform: translateY(0) rotate(0) scale(1); } 12% { transform: translateY(-8px) rotate(-4deg) scale(1.05); } 25% { transform: translateY(-4px) rotate(5deg) scale(1.08); } 42% { transform: translateY(3px) rotate(-3deg) scale(.98); } 62% { transform: translateY(12px) rotate(2deg) scale(.94); } 82% { transform: translateY(5px) rotate(-1deg) scale(1.02); } 100% { transform: translateY(0) rotate(0) scale(1); } }
        @keyframes crack-flash { 0% { opacity: 0; transform: scale(.55); } 28% { opacity: .95; } 100% { opacity: 0; transform: scale(1.18); } }
        @keyframes break-flash { 0% { opacity: 0; transform: scale(.35); } 30% { opacity: 1; border-width: 12px; } 100% { opacity: 0; transform: scale(1.48); border-width: 2px; } }
        @keyframes hp-damage { 0%, 100% { filter: none; } 25%, 65% { filter: brightness(1.55) saturate(1.5); box-shadow: 0 0 15px #e94b3c; } }
        @keyframes shell-fragment { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(0) scale(.25); } 14% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--rotation)) scale(.85); } }
    </style>
</head>
<body class="mode-select">

    <!-- 1. 役割選択画面 -->
    <div id="role-selection" class="hud-panel">
        <h1>ドラゴンクエッション</h1>
        <p>どちらの画面として起動しますか？</p>
        <button class="btn-large" onclick="selectRole('monitor')">モニター (大画面表示用)</button>
        <button class="btn-large" onclick="selectRole('controller')">コントローラー (スマホ操作用)</button>
    </div>

    <!-- 2. モニター用 画面群 -->
    <div id="monitor-container">
        <video id="bg-video" autoplay loop muted playsinline><source src="/assets/background.mp4" type="video/mp4"></video>
        <div class="fpv-container" aria-hidden="true">
            <div class="rope rope-left"></div><div class="rope rope-right"></div>
            <div class="basket-edge"></div>
            <div id="egg-visual"></div><div id="egg-particles"></div>
        </div>
        <div id="hp-panel" class="hud-panel hidden">
            <div id="hp-row"><span>HP</span><span><strong id="hp-count">200</strong> / <strong id="hp-max">200</strong></span></div>
            <div id="hp-track"><div id="hp-bar"></div></div>
        </div>
        <div id="top-hud" class="hud-panel hidden">
            <h3 id="m-question-text"></h3>
            <div id="m-reference" style="margin-top:10px; font-size:0.9rem;"></div>
        </div>
        <div id="monitor-waiting" class="hud-panel">
            <h2>接続コード: <span id="room-code-display" style="font-size: 2.5rem; color: var(--accent-dark);"></span></h2>
            <p id="monitor-status">コントローラー（スマホ等）からこのコードを入力してください</p>
        </div>
        <!-- 激突レイヤー -->
        <div id="clash-layer">
            <div id="clash-p" class="clash-item clash-player"></div>
            <div id="clash-c" class="clash-item clash-correct"></div>
            <div id="clash-flash"></div>
            <div id="diff-result"></div>
        </div>
    </div>

    <!-- 3. コントローラー用 画面群 -->
    <div id="controller-container">
        <!-- 接続 -->
        <div id="c-login" class="hud-panel">
            <h2>モニターに接続</h2>
            <p>モニター画面に表示されたコードを入力</p>
            <input type="number" id="room-code-input" placeholder="例: 1234" inputmode="numeric">
            <button onclick="joinRoom()" class="btn-large">接続する</button>
            <div id="login-feedback" class="feedback"></div>
        </div>
        <!-- 待機・スタート -->
        <div id="c-start" class="hud-panel hidden">
            <h2>接続完了！</h2>
            <p>準備ができたらスタートを押してください</p>
            <button onclick="startGame()" class="btn-large">ゲームスタート</button>
            <div class="feedback" id="start-feedback"></div>
        </div>
        <!-- クイズ入力 -->
        <div id="c-quiz" class="hud-panel hidden">
            <h3 id="c-question-text"></h3>
            <div id="input-container">
                <input type="number" id="answer-input" placeholder="数字を入力" inputmode="numeric">
                <button onclick="submitAnswer()" class="btn-large" id="submit-button">解答する</button>
            </div>
            <div id="c-feedback" class="feedback"></div>
            <button id="next-button" class="btn-large hidden" onclick="goToNextQuestion()">次の問題へ</button>
        </div>
        <!-- 結果 -->
        <div id="c-result" class="hud-panel hidden">
            <h2 id="c-result-title"></h2>
            <p id="c-result-message" style="font-weight: bold;"></p>
            <button class="btn-large" onclick="startGame()">もう一度遊ぶ</button>
        </div>
    </div>

    <script>
        const socket = io();
        let myRoomId = null;
        let isMonitor = false;

        const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

        // ==========================================
        // 初期モード選択
        // ==========================================
        function selectRole(role) {
            document.body.className = `mode-${role}`;
            if (role === 'monitor') {
                isMonitor = true;
                socket.emit('createRoom');
            } else {
                isMonitor = false;
                // コントローラーの場合は背景動画を消して軽くする
                const v = document.getElementById('bg-video');
                if (v) v.remove();
            }
        }

        // ==========================================
        // 接続処理
        // ==========================================
        socket.on('roomCreated', (roomId) => {
            myRoomId = roomId;
            document.getElementById('room-code-display').textContent = roomId;
        });

        function joinRoom() {
            const code = document.getElementById('room-code-input').value;
            if(!code) return;
            document.getElementById('login-feedback').textContent = "接続中...";
            socket.emit('joinRoom', code);
        }

        socket.on('joinedRoom', (roomId) => {
            myRoomId = roomId;
            document.getElementById('c-login').classList.add('hidden');
            document.getElementById('c-start').classList.remove('hidden');
        });

        socket.on('playerJoined', () => {
            if (isMonitor) {
                document.getElementById('monitor-status').innerHTML = '<strong style="color: green;">コントローラーが接続しました！<br>スタートボタンを押してください。</strong>';
            }
        });

        socket.on('errorMsg', (msg) => {
            if(!isMonitor) {
                document.getElementById('login-feedback').textContent = msg;
                document.getElementById('start-feedback').textContent = msg;
            }
        });

        // ==========================================
        // ゲーム進行処理
        // ==========================================
        function startGame() {
            socket.emit('startGame', myRoomId);
        }

        socket.on('gameStarted', (data) => {
            if (isMonitor) {
                document.getElementById('monitor-waiting').classList.add('hidden');
                document.getElementById('hp-panel').classList.remove('hidden');
                document.getElementById('top-hud').classList.remove('hidden');
                renderHp(data.hp, data.maxHp, false); // たまごリセット
                setMonitorQuestion(data.question);
            } else {
                document.getElementById('c-start').classList.add('hidden');
                document.getElementById('c-result').classList.add('hidden');
                document.getElementById('c-quiz').classList.remove('hidden');
                
                document.getElementById('c-question-text').textContent = data.question.text;
                document.getElementById('answer-input').value = '';
                document.getElementById('answer-input').disabled = false;
                document.getElementById('submit-button').disabled = false;
                document.getElementById('c-feedback').textContent = '';
                document.getElementById('next-button').classList.add('hidden');
                document.getElementById('input-container').classList.remove('hidden');
            }
        });

        function submitAnswer() {
            const val = document.getElementById('answer-input').value;
            if(val.trim() === '') return;
            
            document.getElementById('answer-input').disabled = true;
            document.getElementById('submit-button').disabled = true;
            document.getElementById('input-container').classList.add('hidden');
            
            socket.emit('submitAnswer', { roomId: myRoomId, answer: Number(val) });
        }

        // 解答結果の受信（両方の画面で同時に発火）
        socket.on('answerResult', async (data) => {
            if (isMonitor) {
                const topHud = document.getElementById('top-hud');
                topHud.classList.add('hidden'); // 問題文隠す
                
                // 激突アニメーション実行（約2.5秒）
                await playClashEffect(document.getElementById('answer-input')?.value || '?', data.correctAnswer, data.difference);
                
                topHud.classList.remove('hidden'); // 問題文復活
                renderHp(data.remainingHp, 200, data.hpLost > 0);
            } else {
                // コントローラー側はモニターのアニメーションが終わるまで待つ
                const feedback = document.getElementById('c-feedback');
                feedback.style.color = '#333';
                feedback.innerHTML = 'モニターで結果を確認中...';
                
                await wait(2800); // モニターの演出完了を待機
                
                feedback.style.color = '#c93a1c';
                feedback.innerHTML = `正解は <strong>${data.correctAnswer}</strong> でした。<br>差分 ${data.difference}、HPが ${data.hpLost} 減りました。`;
                
                if (data.isGameOver || data.isCleared) {
                    showControllerResult(data);
                } else {
                    document.getElementById('next-button').classList.remove('hidden');
                }
            }
        });

        function goToNextQuestion() {
            socket.emit('nextQuestion', myRoomId);
        }

        socket.on('goToNext', (qData) => {
            if (isMonitor) {
                setMonitorQuestion(qData);
            } else {
                document.getElementById('c-question-text').textContent = qData.text;
                document.getElementById('next-button').classList.add('hidden');
                document.getElementById('c-feedback').textContent = '';
                document.getElementById('answer-input').value = '';
                document.getElementById('answer-input').disabled = false;
                document.getElementById('submit-button').disabled = false;
                document.getElementById('input-container').classList.remove('hidden');
            }
        });

        function showControllerResult(data) {
            document.getElementById('c-quiz').classList.add('hidden');
            document.getElementById('c-result').classList.remove('hidden');
            document.getElementById('c-result-title').textContent = data.isCleared ? 'ゲームクリア！' : 'ゲームオーバー';
            document.getElementById('c-result-message').textContent = data.isCleared 
                ? `たまごを守り抜きました！ 残りHP: ${data.remainingHp}`
                : 'HPが0になり、たまごが割れてしまいました。';
            
            if (isMonitor) {
                document.getElementById('top-hud').classList.add('hidden');
            }
        }

        // ==========================================
        // モニター用 UI 制御関数群
        // ==========================================
        function setMonitorQuestion(q) {
            const qt = document.getElementById('m-question-text');
            qt.textContent = q.text;
            qt.classList.remove('pop-appear');
            void qt.offsetWidth; 
            qt.classList.add('pop-appear');
            document.getElementById('m-reference').textContent = q.reference ? `出典: ${q.reference}` : '';
        }

        async function playClashEffect(playerAns, correctAns, diff) {
            const layer = document.getElementById('clash-layer');
            const p = document.getElementById('clash-p');
            const c = document.getElementById('clash-c');
            const flash = document.getElementById('clash-flash');
            const d = document.getElementById('diff-result');

            p.textContent = playerAns; c.textContent = correctAns; d.textContent = diff;
            
            layer.classList.add('active');
            p.classList.add('animate'); c.classList.add('animate');
            
            await wait(450); 
            
            p.classList.remove('animate'); c.classList.remove('animate');
            flash.classList.add('animate');
            d.classList.remove('hidden'); d.classList.add('animate');
            
            await wait(1400); 

            layer.classList.remove('active');
            await wait(300); 
            flash.classList.remove('animate'); d.classList.remove('animate', 'hidden');
        }

        const EGG_POSITIONS = { 1: '0% 0%', 2: '25% 0%', 3: '50% 0%', 4: '75% 0%', 5: '100% 0%', 6: '0% 50%', 7: '25% 50%', 15: '100% 100%' };
        function renderHp(hp, maxHp, animateHit = false) {
            const safeHp = Math.max(0, Math.min(maxHp, hp));
            const stage = safeHp <= 0 ? 15 : (safeHp >= maxHp ? 1 : Math.min(7, Math.ceil(((maxHp - safeHp) / maxHp) * 6) + 1));
            document.getElementById('hp-count').textContent = safeHp;
            document.getElementById('hp-bar').style.width = `${(safeHp / maxHp) * 100}%`;
            document.getElementById('egg-visual').style.backgroundPosition = EGG_POSITIONS[stage];
            
            if (animateHit) {
                const ev = document.getElementById('egg-visual');
                const hb = document.getElementById('hp-bar');
                const anim = stage === 15 ? 'breaking' : 'damaged';
                ev.classList.remove('damaged', 'breaking'); hb.classList.remove('damage');
                void ev.offsetWidth;
                ev.classList.add(anim); hb.classList.add('damage');
                setTimeout(() => { ev.classList.remove(anim); hb.classList.remove('damage'); }, 1000);
            }
        }
    </script>
</body>
</html>
